# Legacy upstream-training environment (GPU models, DIAMOND and MMseqs2).
# The audited fixed-input revision uses requirements-revision.txt instead.
# These broad ranges are not a solved lockfile and do not establish an exact
# or universally compatible rebuild. Resolve and verify predictor-specific
# environments separately before retraining; do not mix this NumPy<2 stack
# with the canonical OR-Tools 9.15 / NumPy 2 revision environment.
name: pfp
channels:
  - conda-forge
  - pytorch
  - nvidia
  - bioconda
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24,<2.0
  - pandas>=2.0,<3.0
  - scipy>=1.10,<2.0
  - scikit-learn>=1.3,<2.0
  - networkx>=3.0,<4.0
  - tqdm>=4.65,<5.0
  - click>=8.1,<9.0
  - pyyaml>=6.0,<7.0
  - biopython>=1.81,<2.0
  - pytorch>=2.1,<3.0
  - pytorch-cuda=12.1
  - torchvision>=0.16,<1.0
  - torchaudio>=2.1,<3.0
  - diamond>=2.1,<3.0
  - mmseqs2>=15
  - pip:
      - ortools>=9.11,<10.0
      - fair-esm>=2.0,<3.0
      - transformers>=4.30,<5.0
      - dgl>=1.1
